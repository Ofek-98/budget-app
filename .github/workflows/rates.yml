name: Update interest and CPI data

on:
  schedule:
    - cron: "30 4 * * *" # daily, 07:30 Israel time
  workflow_dispatch:
  push:
    paths:
      - tools/fetch_rates.py
      - .github/workflows/rates.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_rates.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/rates.json && git ls-files --error-unmatch data/rates.json >/dev/null 2>&1; then
            echo "No change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rates.json
          git commit -m "Update interest and CPI data"
          git push
